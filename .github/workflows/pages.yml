name: Publier le portfolio

on:
  push:
    branches: [main]
  schedule:
    # Toutes les heures en séance (heure UTC), du lundi au vendredi
    - cron: "20 7-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Préparer le site
        run: |
          mkdir -p site
          cp index.html site/
          cp CV_KOUAME_Ange.pdf site/

      - name: Récupérer les cotations
        # Si Yahoo Finance échoue, le site est publié quand même avec les données intégrées
        continue-on-error: true
        run: |
          pip install yfinance pandas
          python scripts/update_quotes.py site/quotes.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
